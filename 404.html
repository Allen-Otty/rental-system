    <script>
      // Set the theme before first paint so there is no flash. Saved choice wins, then the device setting.
      try {
        var t = localStorage.getItem("makao-theme");
        if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
        var l = localStorage.getItem("makao-lang");
        if (l) document.documentElement.setAttribute("lang", l);
      } catch (e) {}
    </script>
